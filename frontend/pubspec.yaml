name: smartshare_app
description: "TRACE - Smart mobility & delivery platform"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # MAP + LOCATION
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0

  # NETWORKING + STORAGE
  http: any
  shared_preferences: ^2.2.2

  # PAYMENTS
  razorpay_flutter: ^1.3.7

  # 🔥 FIREBASE NOTIFICATIONS
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # 🔥 PDF GENERATION
  pdf: ^3.10.7
  printing: ^5.12.0
  path_provider: ^2.1.1

  # 🔥 STATE MANAGEMENT & FOOD SYSTEM
  flutter_riverpod: ^2.4.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0

  # UI / UTILITIES
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  animations: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/camry.png
